[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qkit-research"
version = "0.1.0"
description = "The checks a quantitative researcher forgets: lookahead detection, survivorship auditing, purged cross-validation and deflated Sharpe."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Wenke Du"}]
keywords = ["quantitative", "backtest", "lookahead", "purged", "sharpe"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
qkit = "qkit.cli:main"

[tool.setuptools.packages.find]
include = ["qkit*"]
